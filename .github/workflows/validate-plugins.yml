name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - ".claude-plugin/**"
      - ".grok-plugin/**"
      - ".agents/plugins/**"
      - "**/plugin.json"
      - "**/mcp.json"
      - "**/.mcp.json"
      - "schemas/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Check generated harness marketplaces
        run: node scripts/generate-harness-marketplaces.mjs --check

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Test harness marketplace generator
        run: node scripts/generate-harness-marketplaces.test.mjs
